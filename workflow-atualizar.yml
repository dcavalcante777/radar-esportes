name: Atualizar Radar Esportes

on:
  schedule:
    # 09h00, 15h00 e 21h00 no horário de Brasília (o GitHub usa UTC)
    - cron: "0 12,18 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar as manchetes do momento
        run: python atualizar_noticias.py index.html

      - name: Publicar a página atualizada
        run: |
          git config user.name "Radar Esportes"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Manchetes atualizadas"
          git push
