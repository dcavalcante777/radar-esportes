<html lang="pt-BR" dir="ltr">

<meta name="color-scheme" content="dark light">
<title>Radar Esportes — TNT Sports</title>
<style>
  :root{
    --bg:#0d0f14; --bg-soft:#151922; --card:#171c26; --card-hover:#1e2430;
    --border:#252c3a; --txt:#eef1f6; --txt-dim:#9aa5b8; --accent:#ffd400;
    --accent-2:#e2001a; --chip:#1d2431; --shadow:0 6px 22px rgba(0,0,0,.45);
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f9; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f0f2f7;
      --border:#e0e4ec; --txt:#12151c; --txt-dim:#5c6579; --chip:#eef1f6;
      --shadow:0 4px 16px rgba(20,25,40,.10); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;}
  header{position:sticky;inset-block-start:0;z-index:20;background:var(--bg-soft);
    border-block-end:1px solid var(--border);padding:14px 20px;box-shadow:var(--shadow)}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{inline-size:44px;block-size:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:19px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .sub{font-size:12px;color:var(--txt-dim);margin-block-start:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search]{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 12px;border-radius:10px;min-inline-size:210px;font-size:14px}
  button{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
  button:hover{background:var(--card-hover)}
  button.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-block-start:12px}
  .chip{background:var(--chip);border:1px solid var(--border);color:var(--txt-dim);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
  main{padding:20px;max-inline-size:1500px;margin-inline:auto}
  .status{font-size:13px;color:var(--txt-dim);margin-block-end:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot{inline-size:8px;block-size:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:.15s}
  .card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:var(--shadow)}
  .thumb{aspect-ratio:16/9;inline-size:100%;object-fit:cover;background:var(--chip);display:block}
  .ph{aspect-ratio:16/9;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    color:#fff;text-align:center;padding:12px;position:relative;overflow:hidden}
  .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.34))}
  .ph b{font-weight:800;font-size:17px;letter-spacing:.5px;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .ph span{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;z-index:1}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .src{background:var(--chip);border:1px solid var(--border);padding:3px 8px;border-radius:999px;font-weight:700;color:var(--txt)}
  .ttl{font-size:15px;font-weight:700;line-height:1.35;margin:0}
  .desc{font-size:13px;color:var(--txt-dim);line-height:1.45;margin:0}
  .section-title{font-size:15px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--txt-dim);margin:28px 0 12px;padding-block-end:8px;border-block-end:1px solid var(--border)}
  .xgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .xcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px}
  .xcard:hover{background:var(--card-hover)}
  .xname{font-weight:700;font-size:14px}
  .xhandle{font-size:12px;color:var(--txt-dim)}
  .empty{padding:40px;text-align:center;color:var(--txt-dim);font-size:14px}
  footer{padding:24px 20px 40px;text-align:center;color:var(--txt-dim);font-size:12px}
  @media print{header{position:static}.card:hover{transform:none}}
</style>

  function txt(node, names) {
    for (var i = 0; i < names.length; i++) {
      var el = node.getElementsByTagName(names[i])[0];
      if (el && el.textContent) { return el.textContent.trim(); }
    }
    return "";
  }

  var EXT_IMG = /\.(jpe?g|png|webp|avif)(\?|$|&)/i;

  function ehImagem(url, tipo) {
    if (!url || url.indexOf("http") !== 0) { return false; }
    if (tipo && tipo.indexOf("image") === 0) { return true; }
    return EXT_IMG.test(url) || /\/(img|image|fotos?|media|thumb)/i.test(url);
  }

  function firstImage(node) {
    var todos = node.getElementsByTagName("*");
    for (var i = 0; i < todos.length; i++) {
      var el = todos[i];
      var u = el.getAttribute("url") || el.getAttribute("href") || el.getAttribute("src");
      if (ehImagem(u, el.getAttribute("type"))) { return u; }
    }
    for (var k = 0; k < todos.length; k++) {
      var nome = todos[k].nodeName.split(":").pop().toLowerCase();
      if (nome === "url" || nome === "image" || nome === "thumbnail") {
        var t = (todos[k].textContent || "").trim();
        if (ehImagem(t, "")) { return t; }
      }
    }
    var blob = txt(node, ["content:encoded", "encoded", "description", "summary", "content"]);
    var m = blob.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (m) { return m[1]; }
    m = blob.match(/https?:\/\/[^\s"\'<>]+\.(?:jpe?g|png|webp|avif)/i);
    if (m) { return m[0]; }
    return "";
  }

  function corDaFonte(nome) {
    var h = 0;
    for (var i = 0; i < nome.length; i++) { h = (h * 31 + nome.charCodeAt(i)) % 360; }
    return h;
  }

  function clean(html) {
    var d = document.createElement("div");
    d.innerHTML = String(html || "");
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }

  function parseFeed(xmlText, feed) {
    var doc = new DOMParser().parseFromString(xmlText, "text/xml");
    if (doc.getElementsByTagName("parsererror").length) { return []; }
    var nodes = doc.getElementsByTagName("item");
    if (!nodes.length) { nodes = doc.getElementsByTagName("entry"); }
    var out = [];
    for (var i = 0; i < nodes.length && i < 14; i++) {
      var n = nodes[i];
      var link = txt(n, ["link"]);
      if (!link) {
        var a = n.getElementsByTagName("link")[0];
        if (a) { link = a.getAttribute("href") || ""; }
      }
      var title = clean(txt(n, ["title"]));
      if (!title || !link) { continue; }
      var dstr = txt(n, ["pubDate", "published", "updated", "dc:date"]);
      var when = dstr ? new Date(dstr).getTime() : 0;
      out.push({
        title: title,
        link: link,
        desc: clean(txt(n, ["description", "summary"])).slice(0, 160),
        img: firstImage(n),
        src: feed.name,
        cat: feed.cat,
        when: isNaN(when) ? 0 : when
      });
    }
    return out;
  }

  function fetchFeed(feed) {
    var idx = 0;
    function attempt() {
      if (idx >= PROXIES.length) { return Promise.resolve([]); }
      var url = PROXIES[idx++](feed.url);
      return fetch(url, { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
        .then(function (t) {
          var parsed = parseFeed(t, feed);
          if (!parsed.length) { throw new Error("empty"); }
          return parsed;
        })
        .catch(function () { return attempt(); });
    }
    return attempt();
  }

  function ago(ts) {
    if (!ts) { return ""; }
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) { return "agora"; }
    if (mins < 60) { return "há " + mins + " min"; }
    var h = Math.round(mins / 60);
    if (h < 24) { return "há " + h + "h"; }
    return "há " + Math.round(h / 24) + "d";
  }

  function placeholder(it) {
    var h = corDaFonte(it.src);
    var d = document.createElement("div");
    d.className = "ph";
    d.style.background = "linear-gradient(135deg,hsl(" + h + ",42%,26%),hsl(" + ((h + 42) % 360) + ",48%,17%))";
    var b = document.createElement("b");
    b.textContent = it.src;
    var c = document.createElement("span");
    c.textContent = it.cat;
    d.appendChild(b);
    d.appendChild(c);
    return d;
  }

  function card(it) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = it.link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    if (it.img && /^https?:\/\//i.test(it.img)) {
      var img = document.createElement("img");
      img.className = "thumb";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.alt = "";
      img.src = it.img;
      img.addEventListener("error", function () {
        if (img.parentNode) { img.parentNode.replaceChild(placeholder(it), img); }
      });
      a.appendChild(img);
    } else {
      a.appendChild(placeholder(it));
    }

    var body = document.createElement("div");
    body.className = "body";
    var meta = document.createElement("div");
    meta.className = "meta";
    var s = document.createElement("span");
    s.className = "src";
    s.textContent = it.src;
    var t = document.createElement("span");
    t.textContent = ago(it.when);
    meta.appendChild(s);
    meta.appendChild(t);
    var h = document.createElement("p");
    h.className = "ttl";
    h.textContent = it.title;
    var d = document.createElement("p");
    d.className = "desc";
    d.textContent = it.desc;
    body.appendChild(meta);
    body.appendChild(h);
    if (it.desc) { body.appendChild(d); }
    a.appendChild(body);
    return a;
  }

  function render() {
    var q = qEl.value.toLowerCase().trim();
    var list = items.filter(function (it) {
      var okCat = activeCat === "Tudo" || it.cat === activeCat;
      var okQ = !q || (it.title + " " + it.desc + " " + it.src).toLowerCase().indexOf(q) >= 0;
      return okCat && okQ;
    });
    grid.textContent = "";
    list.forEach(function (it) { grid.appendChild(card(it)); });
    emptyEl.hidden = list.length > 0;
  }

  function buildChips() {
    var cats = ["Tudo", "Brasil", "Europa", "Outros"];
    var box = document.getElementById("chips");
    cats.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = c;
      b.setAttribute("aria-pressed", c === activeCat ? "true" : "false");
      b.addEventListener("click", function () {
        activeCat = c;
        Array.prototype.forEach.call(box.children, function (x) {
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
        });
        render();
      });
      box.appendChild(b);
    });
  }

  var CANAIS = [
    { nome: "TNT Sports Brasil", handle: "tntsportsbr" },
    { nome: "ge tv",            handle: "getv" },
    { nome: "CazéTV",           handle: "CazeTV" },
    { nome: "ESPN Brasil",      handle: "ESPNBrasil" },
    { nome: "Lance!",           handle: "lancenet" }
  ];

  var POR_CANAL = 4;

  function idDoCanal(handle) {
    var chave = "yt:" + handle;
    var guardado = null;
    try { guardado = JSON.parse(localStorage.getItem(chave) || "null"); } catch (e) { guardado = null; }
    if (guardado && guardado.id && (Date.now() - guardado.em) < 30 * 24 * 3600 * 1000) {
      return Promise.resolve(guardado.id);
    }
    var pagina = "https://www.youtube.com/@" + handle;
    var i = 0;
    function tentar() {
      if (i >= PROXIES.length) { return Promise.resolve(""); }
      return fetch(PROXIES[i++](pagina), { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
        .then(function (t) {
          var m = t.match(/"(?:channelId|externalId)":"(UC[\w-]{20,})"/);
          if (!m) { throw new Error("sem id"); }
          try { localStorage.setItem(chave, JSON.stringify({ id: m[1], em: Date.now() })); } catch (e) {}
          return m[1];
        })
        .catch(function () { return tentar(); });
    }
    return tentar();
  }

  function videosDoCanal(canal) {
    return idDoCanal(canal.handle).then(function (id) {
      if (!id) { return []; }
      var feed = "https://www.youtube.com/feeds/videos.xml?channel_id=" + id;
      var i = 0;
      function tentar() {
        if (i >= PROXIES.length) { return Promise.resolve([]); }
        return fetch(PROXIES[i++](feed), { cache: "no-store" })
          .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
          .then(function (t) {
            var doc = new DOMParser().parseFromString(t, "text/xml");
            if (doc.getElementsByTagName("parsererror").length) { throw new Error("xml"); }
            var entradas = doc.getElementsByTagName("entry");
            if (!entradas.length) { throw new Error("vazio"); }
            var saida = [];
            for (var k = 0; k < entradas.length && k < POR_CANAL; k++) {
              var e = entradas[k];
              var vid = txt(e, ["yt:videoId", "videoId"]);
              var titulo = clean(txt(e, ["title"]));
              if (!vid || !titulo) { continue; }
              var d = txt(e, ["published", "updated"]);
              var ts = d ? new Date(d).getTime() : 0;
              saida.push({
                title: titulo,
                link: "https://www.youtube.com/watch?v=" + vid,
                desc: clean(txt(e, ["media:description", "description"])).slice(0, 140),
                img: "https://i.ytimg.com/vi/" + vid + "/hqdefault.jpg",
                src: canal.nome,
                cat: "Vídeo",
                when: isNaN(ts) ? 0 : ts
              });
            }
            if (!saida.length) { throw new Error("vazio"); }
            return saida;
          })
          .catch(function () { return tentar(); });
      }
      return tentar();
    });
  }

  function carregarVideos() {
    var caixa = document.getElementById("vgrid");
    var aviso = document.getElementById("vstatus");
    aviso.textContent = "Buscando os vídeos mais recentes…";
    Promise.all(CANAIS.map(videosDoCanal)).then(function (todos) {
      var lista = [];
      var vistos = {};
      todos.forEach(function (arr) {
        arr.forEach(function (v) {
          if (!vistos[v.link]) { vistos[v.link] = 1; lista.push(v); }
        });
      });
      lista.sort(function (a, b) { return b.when - a.when; });
      lista = lista.slice(0, 12);
      caixa.textContent = "";
      lista.forEach(function (v) { caixa.appendChild(card(v)); });
      aviso.textContent = lista.length
        ? lista.length + " vídeos de " + Object.keys(lista.reduce(function (o, v) { o[v.src] = 1; return o; }, {})).length + " canais"
        : "Não consegui carregar os vídeos agora — os canais continuam acessíveis pelo YouTube.";
    });
  }

  function buildX() {
    var box = document.getElementById("xgrid");
    X_ACCOUNTS.forEach(function (acc) {
      var a = document.createElement("a");
      a.className = "xcard";
      a.href = "https://x.com/" + acc.h;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      var n = document.createElement("span");
      n.className = "xname";
      n.textContent = acc.n;
      var hh = document.createElement("span");
      hh.className = "xhandle";
      hh.textContent = "@" + acc.h;
      a.appendChild(n);
      a.appendChild(hh);
      box.appendChild(a);
    });
  }

  function showFallback(note) {
    items = FALLBACK.slice();
    render();
    statusEl.textContent = note;
  }

  function load() {
    if (!items.length) { showFallback("Mostrando o resumo salvo — buscando manchetes ao vivo…"); }
    else { statusEl.textContent = "Buscando manchetes nas fontes…"; }
    var done = 0;
    var jobs = FEEDS.map(function (f) {
      return fetchFeed(f).then(function (res) {
        done += 1;
        statusEl.textContent = "Buscando manchetes… (" + done + "/" + FEEDS.length + " fontes)";
        return res;
      });
    });
    Promise.all(jobs).then(function (all) {
      var seen = {};
      items = [];
      all.forEach(function (arr) {
        arr.forEach(function (it) {
          var key = it.title.toLowerCase().slice(0, 70);
          if (!seen[key]) { seen[key] = 1; items.push(it); }
        });
      });
      if (!items.length) { showFallback(SNAPSHOT_NOTE); return; }
      items.sort(function (a, b) { return b.when - a.when; });
      var fontes = {};
      items.forEach(function (i) { fontes[i.src] = 1; });
      var now = new Date();
      statusEl.textContent = items.length
        ? items.length + " manchetes de " + Object.keys(fontes).length + " fontes • atualizado em "
          + now.toLocaleDateString("pt-BR") + " às " + now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        : SNAPSHOT_NOTE;
      render();
    });
  }

  buildChips();
  buildX();
  carregarVideos();
  qEl.addEventListener("input", render);
  document.getElementById("reload").addEventListener("click", function () { load(); carregarVideos(); });
  load();
  setInterval(load, 30 * 60 * 1000);
  setInterval(carregarVideos, 60 * 60 * 1000);
})();
</script>
</body>
</html>
