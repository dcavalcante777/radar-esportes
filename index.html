<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Radar Esportes — TNT Sports</title>
<style>
  :root{
    --bg:#0d0f14; --bg-soft:#151922; --card:#171c26; --card-hover:#1e2430;
    --border:#252c3a; --txt:#eef1f6; --txt-dim:#9aa5b8; --accent:#ffd400;
    --accent-2:#e2001a; --chip:#1d2431; --shadow:0 6px 22px rgba(0,0,0,.45);
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f9; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f0f2f7;
      --border:#e0e4ec; --txt:#12151c; --txt-dim:#5c6579; --chip:#eef1f6;
      --shadow:0 4px 16px rgba(20,25,40,.10); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background-image:
      radial-gradient(900px 420px at 12% -8%, rgba(255,212,0,.10), transparent 60%),
      radial-gradient(760px 380px at 88% -4%, rgba(226,0,26,.12), transparent 62%);
    background-attachment:fixed;}
  header{position:sticky;inset-block-start:0;z-index:20;
    background:color-mix(in srgb, var(--bg-soft) 88%, transparent);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-block-end:1px solid var(--border);padding:12px 20px 0;box-shadow:var(--shadow)}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{inline-size:46px;block-size:46px;border-radius:14px;flex:none;
    background:#0d0f14;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 4px 16px rgba(255,0,228,.30)}
  .logo img{inline-size:100%;block-size:100%;object-fit:cover;display:block}
  h1{background:linear-gradient(90deg,var(--txt),#ff00e4);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .sub{font-size:12px;color:var(--txt-dim);margin-block-start:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search]{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 12px;border-radius:10px;min-inline-size:200px;font-size:14px}
  button{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
  button:hover{background:var(--card-hover)}
  button.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  .nav-caixa{position:relative;margin-block-start:12px}
  nav{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;padding-inline:4px}
  nav::-webkit-scrollbar{display:none}
  .nav-caixa::before,.nav-caixa::after{content:"";position:absolute;inset-block:0;
    inline-size:36px;pointer-events:none;z-index:2;opacity:0;transition:opacity .2s}
  .nav-caixa::before{inset-inline-start:0;
    background:linear-gradient(to right,var(--bg-soft),transparent)}
  .nav-caixa::after{inset-inline-end:0;
    background:linear-gradient(to left,var(--bg-soft),transparent)}
  .nav-caixa.tem-esq::before{opacity:1}
  .nav-caixa.tem-dir::after{opacity:1}
  .nav-seta{position:absolute;inset-block-start:50%;transform:translateY(-50%);z-index:3;
    inline-size:26px;block-size:26px;padding:0;border-radius:50%;display:none;
    align-items:center;justify-content:center;font-size:15px;line-height:1;
    background:var(--card);border:1px solid var(--border);color:var(--txt)}
  .nav-seta.esq{inset-inline-start:-2px}
  .nav-seta.dir{inset-inline-end:-2px}
  .nav-caixa.tem-esq .nav-seta.esq{display:flex}
  .nav-caixa.tem-dir .nav-seta.dir{display:flex}
  @media (max-width:700px){.nav-seta{display:none!important}
    nav{scroll-snap-type:x proximity}
    .tab{scroll-snap-align:center}}
  .aviso-abas{font-size:10.5px;color:var(--txt-dim);letter-spacing:.3px;
    padding:0 4px 6px;display:none}
  @media (max-width:700px){.aviso-abas{display:block}}
  .tab{background:none;border:0;border-block-end:3px solid transparent;border-radius:0;
    color:var(--txt-dim);padding:11px 14px;font-size:13px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;white-space:nowrap;cursor:pointer;position:relative;
    transition:color .18s}
  .tab:hover{background:none;color:var(--txt)}
  .tab[aria-selected="true"]{color:var(--txt);border-block-end-color:var(--accent)}
  .tab[aria-selected="true"]::before{content:"";position:absolute;inset:4px 6px 6px;
    border-radius:9px;background:linear-gradient(180deg,rgba(255,212,0,.16),transparent);
    z-index:-1}
  .tab .n{font-size:11px;color:var(--txt-dim);margin-inline-start:5px;font-weight:600}
  .placar{position:relative;margin:0 -20px;padding:0;border-block-end:1px solid var(--border);
    background:linear-gradient(90deg,rgba(226,0,26,.10),transparent 30%)}
  .placar[hidden]{display:none}
  .placar-topo{display:flex;align-items:center;gap:8px;padding:7px 20px 0;font-size:11px;
    font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-dim)}
  .ao-vivo{display:inline-flex;align-items:center;gap:5px;color:var(--accent-2);font-weight:800}
  .ao-vivo i{inline-size:7px;block-size:7px;border-radius:50%;background:var(--accent-2);
    display:inline-block;animation:pulsa 1.1s ease-in-out infinite}
  .trilho{display:flex;gap:10px;overflow-x:auto;padding:8px 20px 10px;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none}
  .trilho::-webkit-scrollbar{display:none}
  .jogo{flex:none;inline-size:206px;background:var(--card);border:1px solid var(--border);
    border-radius:11px;padding:8px 10px;text-decoration:none;color:inherit;display:flex;
    flex-direction:column;gap:5px;transition:.15s}
  .jogo:hover{background:var(--card-hover);border-color:var(--txt-dim)}
  .jogo.vivo{border-color:rgba(226,0,26,.55);box-shadow:0 0 0 1px rgba(226,0,26,.18) inset}
  .jogo-topo{display:flex;justify-content:space-between;align-items:center;gap:6px;
    font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--txt-dim)}
  .jogo-topo b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .minuto{color:var(--accent-2);font-weight:800;flex:none}
  .time{display:flex;align-items:center;gap:7px;font-size:13px}
  .time img{inline-size:17px;block-size:17px;object-fit:contain;flex:none}
  .time span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .time b{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
  .time.perde{color:var(--txt-dim)}
  .seta{position:absolute;inset-block-start:50%;transform:translateY(-30%);z-index:3;
    inline-size:28px;block-size:28px;padding:0;border-radius:50%;display:none;
    align-items:center;justify-content:center;font-size:15px;line-height:1;
    background:var(--bg-soft);border:1px solid var(--border)}
  .seta.esq{inset-inline-start:4px}
  .seta.dir{inset-inline-end:4px}
  .placar:hover .seta{display:flex}
  @media (max-width:700px){.seta{display:none!important}}
  main{padding:20px;max-inline-size:1500px;margin-inline:auto}
  .status{font-size:13px;color:var(--txt-dim);margin-block-end:14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot{inline-size:8px;block-size:8px;border-radius:50%;background:var(--accent);
    display:inline-block;flex:none}
  .dot.on{animation:pulsa 1.1s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:.15s}
  .card:hover{background:var(--card-hover);transform:translateY(-4px);
    box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
  .card:hover .thumb{transform:scale(1.07)}
  .card:hover .ttl{color:var(--accent)}
  .card{animation:entra .4s ease backwards}
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .capa{position:relative;aspect-ratio:16/9;background:var(--chip);overflow:hidden}
  .capa::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.34),transparent 45%)}
  .thumb{inline-size:100%;block-size:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.2,.7,.3,1)}
  .ph{inline-size:100%;block-size:100%;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;color:#fff;text-align:center;padding:12px;
    position:relative;overflow:hidden}
  .ph::after{content:"";position:absolute;inset:0;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.34))}
  .ph b{font-weight:800;font-size:17px;letter-spacing:.5px;z-index:1;
    text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .ph span{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;z-index:1}
  .play{position:absolute;inset-block-end:8px;inset-inline-start:8px;background:rgba(226,0,26,.94);
    color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:6px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;
    color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .src{background:var(--chip);border:1px solid var(--border);padding:3px 8px;
    border-radius:999px;font-weight:700;color:var(--txt)}
  .tag{padding:3px 8px;border-radius:999px;font-weight:700;font-size:10px;
    background:rgba(255,212,0,.14);color:var(--accent);border:1px solid rgba(255,212,0,.28)}
  .ttl{font-size:15px;font-weight:700;line-height:1.35;margin:0;transition:color .18s}
  .desc{font-size:13px;color:var(--txt-dim);line-height:1.45;margin:0}
  .grid{grid-auto-flow:dense}
  .card.destaque{grid-column:span 2;grid-row:span 1}
  .card.destaque .ttl{font-size:20px;line-height:1.28}
  .card.destaque .desc{font-size:14px}
  .card.destaque .capa{aspect-ratio:21/9}
  .card.destaque .body{padding:16px 18px 18px;gap:10px}
  button[aria-pressed="true"]{background:var(--accent);color:#111;border-color:var(--accent)}
  .tag-idioma{font-size:9px;letter-spacing:.6px;padding:2px 6px;border-radius:4px;
    background:var(--chip);border:1px solid var(--border);color:var(--txt-dim);font-weight:700}
  .traduzindo{opacity:.55}
  .selo-calor{position:absolute;inset-block-start:10px;inset-inline-start:10px;z-index:2;
    background:linear-gradient(135deg,#ff6a00,#e2001a);color:#fff;font-size:10px;
    font-weight:900;letter-spacing:.7px;padding:5px 10px;border-radius:6px;
    box-shadow:0 2px 12px rgba(226,0,26,.45)}
  .card.destaque .selo-calor{inset-block-start:auto;inset-block-end:10px}
  .card.fervendo{border-color:rgba(255,106,0,.6);
    box-shadow:0 0 0 1px rgba(255,106,0,.25) inset}
  .marca-nova{position:absolute;inset-block-start:0;inset-inline-start:0;
    inline-size:4px;block-size:100%;background:var(--accent);z-index:3}
  .card{position:relative}
  .divisor-novas{grid-column:1/-1;display:flex;align-items:center;gap:12px;
    margin:6px 0 2px;font-size:11px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:var(--accent)}
  .divisor-novas::before,.divisor-novas::after{content:"";flex:1;block-size:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  #novas{position:relative}
  #novas .bolha{position:absolute;inset-block-start:-6px;inset-inline-end:-6px;
    background:var(--accent-2);color:#fff;font-size:10px;font-weight:900;
    min-inline-size:18px;block-size:18px;border-radius:9px;display:flex;
    align-items:center;justify-content:center;padding:0 5px}
  header{padding-block-end:0}
  .top{padding-block-end:2px}
  h1{font-size:21px}
  input[type=search]{transition:.18s;border-radius:11px}
  input[type=search]:focus{outline:0;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,212,0,.14)}
  .icone{transition:.15s}
  .icone:hover{transform:translateY(-2px)}
  .card{border-radius:15px}
  .ttl{letter-spacing:-.1px}
  .grid{gap:18px}
  main{padding-block-start:22px}
  .status{padding:9px 13px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;margin-block-end:18px}
  .tab{font-size:12.5px;padding:11px 13px}
  .tab .n{background:var(--chip);border-radius:8px;padding:1px 5px;font-size:10px}
  .tab[aria-selected="true"] .n{background:var(--accent);color:#111}
  .meta{gap:7px}
  .src{font-size:10px}
  .card.destaque .body{gap:12px}
  .xcard{transition:.15s}
  .xcard:hover{transform:translateY(-2px)}
  .jogo{border-radius:12px}
  .comp-chip{transition:.15s}
  .comp-chip:hover{color:var(--txt);border-color:var(--txt-dim)}
  footer{border-block-start:1px solid var(--border);margin-block-start:36px;padding-block-start:22px}
  .barra-nav{display:flex;align-items:stretch;gap:10px;margin-block-start:12px}
  .nav-caixa{flex:1;min-inline-size:0}
  .modos{display:flex;gap:6px;align-items:center;padding-inline-start:10px;
    border-inline-start:1px solid var(--border);flex:none}
  .modo{background:var(--chip);border:1px solid var(--border);color:var(--txt-dim);
    padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;white-space:nowrap;
    cursor:pointer;margin-block-end:8px;transition:.15s}
  .modo:hover{color:var(--txt);border-color:var(--txt-dim)}
  .modo[aria-pressed="true"]{background:var(--accent);color:#111;border-color:var(--accent)}
  @media (max-width:820px){
    .barra-nav{flex-direction:column;gap:0}
    .modos{border-inline-start:0;padding-inline-start:0;padding-block:2px 8px}
    .modo{flex:1;text-align:center}
  }
  .icone{inline-size:38px;block-size:38px;padding:0;border-radius:10px;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex:none}
  input[type=search]{min-inline-size:250px}
  @media (max-width:600px){input[type=search]{min-inline-size:150px}}
  .busca-caixa{position:relative;display:flex;align-items:center}
  .limpar{position:absolute;inset-inline-end:6px;background:none;border:0;padding:4px 7px;
    color:var(--txt-dim);font-size:16px;line-height:1;cursor:pointer;display:none;border-radius:6px}
  .limpar:hover{background:var(--card-hover);color:var(--txt)}
  .busca-caixa.tem-texto .limpar{display:block}
  .busca-caixa.tem-texto input[type=search]{padding-inline-end:32px}
  .salvar{position:absolute;inset-block-start:8px;inset-inline-end:8px;z-index:3;

    background:rgba(10,12,18,.62);color:#fff;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
  .card:hover .salvar,.salvar.ativo{opacity:1}
  .salvar:hover{background:rgba(10,12,18,.85);transform:scale(1.1)}
  .salvar.ativo{background:var(--accent);color:#111}
  @media (hover:none){.salvar{opacity:1}}
  #salvos .bolha{position:absolute;inset-block-start:-6px;inset-inline-end:-6px;
    background:var(--accent);color:#111;font-size:10px;font-weight:900;min-inline-size:18px;
    block-size:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    padding:0 5px}
  #salvos{position:relative}
  .selo-breaking{position:absolute;inset-block-start:10px;inset-inline-end:10px;z-index:2;

    background:var(--card)}

    font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;

    var ordem = ordemProxies();
    var i = 0;
    function tentar() {

        .then(function (d) {
          anotarProxy(qual);
          CACHE_JSON[endereco] = { dados: d, em: Date.now() };

        .catch(function () { return tentar(); });

        if (!c || !c.competitors || c.competitors.length < 2) { return; }

        c.competitors.forEach(function (t) {

  // O Google Notícias entrega título com sufixo e link de redirecionamento.
  // Aqui recuperamos o endereço real da matéria e limpamos o título.
  function arrumarGoogle(no, titulo, link) {
    if (link.indexOf("news.google.com") < 0) { return { title: titulo, link: link, desc: null }; }
    var bruto = texto(no, ["description", "summary"]);
    var m = bruto.match(/<a href="(https?:\/\/[^"]+)"/i);
    if (m) { link = m[1]; }
    var corte = titulo.lastIndexOf(" - ");
    if (corte > 0 && (titulo.length - corte) < 43) {
      titulo = titulo.slice(0, corte).trim();
    }
    return { title: titulo, link: link, desc: "" };
  }

  function lerFeed(fonte) {
    var nome = fonte[0];
    var padrao = fonte[1];
    var endereco = fonte[2];
    var ordem = ordemProxies();
    var i = 0;

    function tentar() {
      if (i >= ordem.length) { return Promise.resolve([]); }
      var qual = ordem[i++];
      return buscarComPrazo(PROXIES[qual](endereco), { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
        .then(function (t) { anotarProxy(qual); return t; })
        .then(function (bruto) {
          var doc = new DOMParser().parseFromString(bruto, "text/xml");
          if (doc.getElementsByTagName("parsererror").length) { throw new Error("xml"); }
          var nos = doc.getElementsByTagName("item");
          if (!nos.length) { nos = doc.getElementsByTagName("entry"); }
          if (!nos.length) { throw new Error("vazio"); }
          var saida = [];
          for (var k = 0; k < nos.length && k < 8; k++) {
            var n = nos[k];
            var titulo = semTags(texto(n, ["title"]));
            var link = texto(n, ["link"]);
            if (!link) {
              var a = n.getElementsByTagName("link")[0];
              if (a) { link = a.getAttribute("href") || ""; }
            }
            if (!titulo || !link) { continue; }
            var resumo = semTags(texto(n, ["description", "summary"])).slice(0, 170);
            var arr = arrumarGoogle(n, titulo, link);
            titulo = arr.title;
            link = arr.link;
            if (arr.desc !== null) { resumo = arr.desc; }
            var quandoTxt = texto(n, ["pubDate", "published", "updated", "dc:date"]);
            var ts = quandoTxt ? new Date(quandoTxt).getTime() : 0;
            saida.push({
              title: titulo,
              link: link,
              desc: resumo,
              img: fotoDoItem(n),
              src: nome,
              cat: classificar(titulo + " " + resumo, padrao),
              when: isNaN(ts) ? 0 : ts,
              tipo: "noticia"
            });
          }
          if (!saida.length) { throw new Error("vazio"); }
          return saida;
        })
        .catch(function () { return tentar(); });
    }

      });

      }
      return novidade;
    }

        if (proxima >= FEEDS_VIVO.length) { return; }
        var fonte = FEEDS_VIVO[proxima++];

          if (prontas >= FEEDS_VIVO.length) {
            resolve(lista);

  function extrairFoto(html) {
    var padroes = [
      /<meta[^>]+property=["\']og:image(?::secure_url)?["\'][^>]+content=["\']([^"\']+)["\']/i,
      /<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']/i,
      /<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)["\']/i,
      /<link[^>]+rel=["\']image_src["\'][^>]+href=["\']([^"\']+)["\']/i
    ];
    for (var i = 0; i < padroes.length; i++) {
      var m = html.match(padroes[i]);
      if (m && m[1] && m[1].indexOf("http") === 0) {
        return m[1].replace(/&amp;/g, "&");
      }
    }
    return "";

  function baixarFoto(link) {
    var i = 0;
    function tentar() {
      if (i >= PROXIES.length) { return Promise.resolve(""); }
      var alvo = PROXIES[i++](link);
      if (alvo === link) { return tentar(); }
      return fetch(alvo, { cache: "force-cache" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
        .then(function (html) {
          var achada = extrairFoto(html);
          if (!achada) { throw new Error("sem og"); }
          return achada;
        })
        .catch(function () { return tentar(); });

    return tentar();
  }

    var sem = url.replace(/^https?:\/\//, "");

    function tentar() {
      if (i >= opcoes.length) { reserva(); return; }
      var img = document.createElement("img");
      img.className = "thumb";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";

      });
      img.src = opcoes[i];
      capa.appendChild(img);
    }

    if (opcoes.length) {
      tentar();
    } else {
      capa.appendChild(placeholder(it));
      pedirFoto(it.link, function (url) {
        it.img = url;

  // ---------------- Medidor de calor ----------------
  // Uma notícia é "quente" quando vários veículos publicam a mesma história

  var VAZIAS = {
    "para": 1, "com": 1, "sem": 1, "por": 1, "que": 1, "dos": 1, "das": 1,
    "uma": 1, "vai": 1, "tem": 1, "mais": 1, "após": 1, "apos": 1, "sobre": 1,

    "esta": 1, "isso": 1, "como": 1, "onde": 1, "quem": 1, "não": 1, "nao": 1,
    "ser": 1, "vez": 1, "ver": 1, "diz": 1, "faz": 1, "veja": 1, "após": 1
  };

  var JANELA_CALOR = 90 * 60 * 1000;

  function palavrasChave(titulo) {
    var limpo = titulo.toLowerCase()
      .replace(/[^a-záàâãéêíóôõúüç0-9\s]/gi, " ")
      .split(/\s+/);
    var saida = [];
    limpo.forEach(function (p) {
      if (p.length >= 4 && !VAZIAS[p] && saida.indexOf(p) < 0) { saida.push(p); }
    });
    return saida;
  }

  function parecidos(a, b) {
    if (!a.length || !b.length) { return 0; }
    var iguais = 0;
    a.forEach(function (p) { if (b.indexOf(p) >= 0) { iguais += 1; } });
    return iguais / Math.min(a.length, b.length);
  }

  function calcularCalor(lista) {
    var recentes = [];
    var agora = Date.now();
    lista.forEach(function (it) {
      it.calor = 0;
      it.fontesQuentes = null;
      if (it.tipo !== "noticia" || !it.when) { return; }
      if ((agora - it.when) > JANELA_CALOR) { return; }
      it.chaves = palavrasChave(it.title);
      recentes.push(it);
    });

    var grupos = [];
    recentes.forEach(function (it) {
      var achou = null;
      grupos.forEach(function (g) {
        if (achou) { return; }
        if (parecidos(it.chaves, g.chaves) >= 0.5) { achou = g; }
      });
      if (achou) {
        achou.itens.push(it);
        if (achou.fontes.indexOf(it.src) < 0) { achou.fontes.push(it.src); }
      } else {
        grupos.push({ chaves: it.chaves, itens: [it], fontes: [it.src] });
      }
    });

    grupos.forEach(function (g) {
      if (g.fontes.length < MINIMO_CALOR) { return; }
      g.itens.forEach(function (it) {

  function tocarSino() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      var ctx = new Ctx();
      [880, 1320].forEach(function (hz, i) {
        var osc = ctx.createOscillator();
        var vol = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = hz;
        vol.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.14);
        vol.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + i * 0.14 + 0.02);
        vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.14 + 0.26);
        osc.connect(vol);
        vol.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.14);
        osc.stop(ctx.currentTime + i * 0.14 + 0.3);
      });
    } catch (e) { /* som bloqueado, sem problema */ }
  }

  function combina(it, q) {
    if (!q) { return true; }
    return (it.title + " " + it.desc + " " + it.src).toLowerCase().indexOf(q) >= 0;
  }

  function filtrar(tipo) {
    var q = qEl.value.toLowerCase().trim();
    var base = abaAtiva === "SALVOS" ? listaSalvos() : itens;
    var lista = base.filter(function (it) {
      if (it.tipo !== tipo) { return false; }
      if (!combina(it, q)) { return false; }
      // Buscando, procura em todas as abas de uma vez.
      if (q) { return true; }
      if (abaAtiva === "SALVOS") { return true; }
      if (abaAtiva !== "TUDO" && it.cat !== abaAtiva) { return false; }
      if (soNovas && !ehNovaParaMim(it)) { return false; }
      return true;
    });
    if (tipo === "noticia") {
      // Assunto quente sobe, mas sem bagunçar a ordem do resto.
      lista.sort(function (a, b) {
        var qa = (a.calor >= MINIMO_CALOR && (Date.now() - a.when) < JANELA_CALOR) ? a.calor : 0;
        var qb = (b.calor >= MINIMO_CALOR && (Date.now() - b.when) < JANELA_CALOR) ? b.calor : 0;
        if (qa !== qb) { return qb - qa; }
        return b.when - a.when;
      });
    }
    return lista;
  }

  function marcarAbas() {
    var q = qEl.value.toLowerCase().trim();

      if (cat === "SALVOS") {
        n = listaSalvos().filter(function (it) { return combina(it, q); }).length;
      } else if (cat !== "TABELAS" && cat !== "AGENDA") {
        itens.forEach(function (it) {
          if (cat !== "TUDO" && it.cat !== cat) { return; }
          if (combina(it, q)) { n += 1; }
        });
      }
      b.setAttribute("aria-selected", cat === abaAtiva ? "true" : "false");
      b.querySelector(".n").textContent = n ? n : "";

  function maisNovoDe(lista) {

  function melhorInicio() {
    var salvo = conteudoSalvo();
    if (!salvo) { return { dados: DADOS, origem: "embutido" }; }
    if (maisNovoDe(salvo.itens) >= maisNovoDe(DADOS.itens)) {
      return { dados: salvo, origem: "salvo" };

  var JANELA_HORAS = 24;

  // Junta o que chegou agora com o que ja estava na tela e o que esta guardado,
  // mantendo tudo das ultimas 24h. Assim nada some quando a pagina atualiza.
  function juntar(novosItens) {
    var corte = Date.now() - JANELA_HORAS * 3600 * 1000;
    var guardado = conteudoSalvo();
    var todos = (novosItens || [])
      .concat(itens || [])
      .concat((guardado && guardado.itens) || []);

    var vistos = {};
    var saida = [];
    todos.forEach(function (it) {
      if (!it || !it.link) { return; }
      if (it.when && it.when < corte) { return; }
      var chave = it.link;
      if (vistos[chave]) { return; }
      vistos[chave] = 1;
      saida.push(it);
    });
    saida.sort(function (a, b) { return b.when - a.when; });
    return saida.slice(0, 400);
  }

  function aplicar(dados, novos, guardar) {
    if (!dados || !dados.itens || !dados.itens.length) { return false; }
    itens = guardar ? juntar(dados.itens) : dados.itens;
    carimbo = dados.carimbo || "";
    calcularCalor(itens);
    render(novos);
    atualizarTitulo();
    atualizarBolha();
    checarAvisos();
    if (guardar) { salvarConteudo({ carimbo: carimbo, itens: itens }); }
    return true;
  }

  function aaaammdd(data) {
    var m = String(data.getMonth() + 1);
    var d = String(data.getDate());
    if (m.length < 2) { m = "0" + m; }
    if (d.length < 2) { d = "0" + d; }
    return String(data.getFullYear()) + m + d;

  function jogosDaComp(comp) {
    var endereco = "https://site.api.espn.com/apis/site/v2/sports/soccer/"
      + comp.liga + "/scoreboard?dates=" + janelaAgenda();
    return pegarJson(endereco).then(function (dados) {
      if (!dados || !dados.events) { return []; }
      var saida = [];
      dados.events.forEach(function (ev) {
        var c = ev.competitions && ev.competitions[0];
        if (!c || !c.competitors || c.competitors.length < 2) { return; }
        var casa = null;
        var fora = null;
        c.competitors.forEach(function (t) {
          if (t.homeAway === "home") { casa = t; } else { fora = t; }
        });
        if (!casa || !fora) { return; }
        var st = (ev.status && ev.status.type) || {};
        var quando = ev.date ? new Date(ev.date).getTime() : 0;
        if (!quando) { return; }
        var canais = [];
        if (c.broadcasts) {
          c.broadcasts.forEach(function (b) {
            var nomes = b.names || (b.media && [b.media.shortName]) || [];
            nomes.forEach(function (nm) {
              if (nm && canais.indexOf(nm) < 0) { canais.push(nm); }
            });
          });
        }
        if (c.geoBroadcasts) {
          c.geoBroadcasts.forEach(function (b) {
            var nm = (b.media && (b.media.shortName || b.media.callLetters)) || "";
            if (nm && canais.indexOf(nm) < 0) { canais.push(nm); }
          });
        }
        saida.push({
          comp: comp.nome,
          canais: canais,
          quando: quando,
          estado: st.state || "pre",
          relogio: (ev.status && ev.status.displayClock) || "",
          link: (ev.links && ev.links[0] && ev.links[0].href) || "",
          casa: dadosTime(casa),
          fora: dadosTime(fora)
        });
      });
      return saida;
    });
  }

  var MINHAS_COMPETICOES = {};

  function nomeDoDia(ts) {
    var d = new Date(ts);
    var hoje = new Date();
    var amanha = new Date(hoje.getTime() + 86400000);
    function igual(a, b) {
      return a.getDate() === b.getDate() && a.getMonth() === b.getMonth()
        && a.getFullYear() === b.getFullYear();
    }
    if (igual(d, hoje)) { return "Hoje"; }
    if (igual(d, amanha)) { return "Amanhã"; }
    var semana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
    return semana[d.getDay()] + ", "
      + d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }

  function desenharAgenda(listaBruta) {
    var lista = soMinhas
      ? listaBruta.filter(function (j) { return ehMinha(j); })
      : listaBruta;
    corpoAgenda.textContent = "";
    if (!lista.length) {
      var v = document.createElement("div");
      v.className = "carregando";
      v.textContent = "Nenhum jogo marcado para os próximos dias nessa competição.";
      corpoAgenda.appendChild(v);
      return;
    }
    var porDia = {};
    var ordem = [];
    lista.forEach(function (j) {
      var chave = aaaammdd(new Date(j.quando));
      if (!porDia[chave]) { porDia[chave] = []; ordem.push(chave); }
      porDia[chave].push(j);
    });
    ordem.sort();
    ordem.forEach(function (chave) {
      var jogosDoDia = porDia[chave];
      var titulo = document.createElement("div");
      titulo.className = "dia";
      titulo.appendChild(document.createTextNode(nomeDoDia(jogosDoDia[0].quando)));
      var qtd = document.createElement("span");

      qtd.textContent = jogosDoDia.length + (jogosDoDia.length > 1 ? " jogos" : " jogo");
      titulo.appendChild(qtd);

      var caixa = document.createElement("div");
      caixa.className = "jogos-lista";
      jogosDoDia.forEach(function (j) { caixa.appendChild(linhaAgenda(j)); });
      corpoAgenda.appendChild(caixa);

  var agendaMontadaPara = null;

  function carregarAgenda(chave) {
    if (agendaMontadaPara === chave && corpoAgenda.children.length) { return; }
    agendaMontadaPara = chave;
    if (cacheAgenda[chave]) { desenharAgenda(cacheAgenda[chave]); return; }

    corpoAgenda.textContent = "";
    var carregando = document.createElement("div");
    carregando.className = "carregando";
    carregando.textContent = "Carregando os próximos jogos…";
    corpoAgenda.appendChild(carregando);

    var alvos = chave === "TODOS"
      ? TABELAS
      : TABELAS.filter(function (c) { return c.liga === chave; });

    // Vai desenhando conforme cada competição responde, em vez de
    // esperar as 18 juntas.
    var lista = [];
    var vistos = {};
    var prontas = 0;
    var proxima = 0;
    var POR_VEZ_AGENDA = 5;

    function seguir() {
      if (proxima >= alvos.length) { return; }
      var comp = alvos[proxima++];
      jogosDaComp(comp).then(function (jogos2) {
        if (agendaAtiva !== chave) { return; }
        prontas += 1;
        var novidade = false;
        jogos2.forEach(function (j) {
          var id = j.quando + j.casa.nome + j.fora.nome;
          if (!vistos[id]) { vistos[id] = 1; lista.push(j); novidade = true; }
        });
        if (novidade) {
          lista.sort(function (a, b) { return a.quando - b.quando; });
          desenharAgenda(lista);
        } else if (prontas === 1) {
          carregando.textContent = "Carregando os próximos jogos… ("
            + prontas + " de " + alvos.length + ")";
        }
        if (prontas >= alvos.length) {
          cacheAgenda[chave] = lista;
          if (!lista.length) { desenharAgenda(lista); }
        } else {
          seguir();
        }
      });
    }
    for (var k = 0; k < POR_VEZ_AGENDA; k++) { seguir(); }
  }

  function zonaDaPosicao(liga, posicao, total) {
    var regras = ZONAS[liga];
    if (!regras) { return null; }
    for (var i = 0; i < regras.length; i++) {
      var corte = regras[i][0];
      if (corte > 0 && posicao <= corte) { return regras[i]; }
      if (corte < 0 && posicao > (total + corte)) { return regras[i]; }
    }
    return null;
  }

  function valorStat(stats, nomes) {
    if (!stats) { return "-"; }
    for (var i = 0; i < stats.length; i++) {
      for (var j = 0; j < nomes.length; j++) {
        if (stats[i].name === nomes[j] || stats[i].abbreviation === nomes[j]) {
          var v = stats[i].displayValue;
          if (v === undefined || v === null) { v = stats[i].value; }
          return (v === undefined || v === null) ? "-" : String(v);
        }
      }
    }
    return "-";
  }

  function numeroStat(stats, nomes) {
    var v = valorStat(stats, nomes);
    if (v === "-") { return null; }
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? null : n;
  }

  // A fonte nem sempre devolve a tabela na ordem certa (o caso da MLS).
  // Aqui reordenamos pelo critério padrão do futebol.
  function ordenarTabela(entradas) {
    var lista = entradas.slice();
    lista.sort(function (a, b) {
      var pa = numeroStat(a.stats, ["points"]);
      var pb = numeroStat(b.stats, ["points"]);
      if (pa === null) { pa = -1; }
      if (pb === null) { pb = -1; }
      if (pb !== pa) { return pb - pa; }

      var sa = numeroStat(a.stats, ["pointDifferential", "goalDifference"]);
      var sb = numeroStat(b.stats, ["pointDifferential", "goalDifference"]);
      if (sa === null) { sa = 0; }
      if (sb === null) { sb = 0; }
      if (sb !== sa) { return sb - sa; }

      var ga = numeroStat(a.stats, ["pointsFor", "goalsFor"]);
      var gb = numeroStat(b.stats, ["pointsFor", "goalsFor"]);
      if (ga === null) { ga = 0; }
      if (gb === null) { gb = 0; }
      if (gb !== ga) { return gb - ga; }

      var va = numeroStat(a.stats, ["wins"]);
      var vb = numeroStat(b.stats, ["wins"]);
      if (va === null) { va = 0; }
      if (vb === null) { vb = 0; }
      if (vb !== va) { return vb - va; }

      var na = (a.team && (a.team.displayName || a.team.name)) || "";
      var nb = (b.team && (b.team.displayName || b.team.name)) || "";
      return na.localeCompare(nb);
    });
    return lista;
  }

  // Champions, Libertadores e Sul-Americana devolvem os grupos dentro de uma
  // fase — por isso é preciso descer todos os níveis, não só o primeiro.
  function gruposDaResposta(dados) {
    var grupos = [];
    var vistos = [];

    function descer(no, rotulo) {
      if (!no || typeof no !== "object" || vistos.indexOf(no) >= 0) { return; }
      vistos.push(no);
      var nome = no.name || no.displayName || no.shortName || rotulo || "";

      var ent = no.standings && no.standings.entries;
      if (ent && ent.length) {
        grupos.push({ nome: nome, entradas: ordenarTabela(ent) });
      }
      if (no.entries && no.entries.length && !ent) {
        grupos.push({ nome: nome, entradas: ordenarTabela(no.entries) });
      }
      if (no.children && no.children.length) {
        no.children.forEach(function (filho) { descer(filho, nome); });
      }
      if (no.standings && no.standings.children) {
        no.standings.children.forEach(function (filho) { descer(filho, nome); });
      }
    }

    descer(dados, "");

    // Se o mesmo grupo apareceu em mais de um nível, fica só o mais completo.
    var limpos = [];
    grupos.forEach(function (g) {
      var repetido = false;
      limpos.forEach(function (j) {
        if (j.nome === g.nome && j.entradas.length === g.entradas.length) {
          repetido = true;
        }
      });
      if (!repetido) { limpos.push(g); }
    });
    return limpos;
  }

  // ---------------- Artilheiros e assistências ----------------
  function nomeCurto(a) {

  function lerCraques(liga, tipo) {
    var ordem = tipo === "gols" ? "offensive.totalGoals" : "offensive.goalAssists";
    var url = "https://site.web.api.espn.com/apis/common/v3/sports/soccer/" + liga
      + "/statistics/byathlete?sort=" + ordem + "%3Adesc&limit=10";
    return pegarJson(url, 30 * 60 * 1000).then(function (d) {
      if (!d || !d.athletes || !d.athletes.length) { return []; }
      var saida = [];
      d.athletes.forEach(function (linha) {
        var atleta = linha.athlete || {};
        var valor = null;
        (linha.categories || []).forEach(function (cat) {
          (cat.totals || []).forEach(function (v, i) {
            var nomes = (cat.names || [])[i] || "";
            if (valor === null && (
              (tipo === "gols" && /totalGoals|^goals$/i.test(nomes)) ||
              (tipo === "assist" && /goalAssists|^assists$/i.test(nomes))
            )) { valor = v; }
          });
        });
        if (valor === null && linha.statistics) {
          (linha.statistics || []).forEach(function (st) {
            if (valor === null && st.name && (
              (tipo === "gols" && /goals/i.test(st.name)) ||
              (tipo === "assist" && /assist/i.test(st.name))
            )) { valor = st.displayValue || st.value; }
          });
        }
        if (!nomeCurto(atleta)) { return; }
        saida.push({
          nome: nomeCurto(atleta),
          time: (linha.team && (linha.team.abbreviation || linha.team.displayName)) || "",
          foto: atleta.headshot && atleta.headshot.href,
          valor: (valor === null || valor === undefined) ? "-" : String(valor)

      return saida.slice(0, 10);

  // ---------------- Confrontos por rodada ----------------
  var deslocamentoRodada = 0;

  function faixaDaRodada(passo) {
    var base = new Date();
    base.setDate(base.getDate() + passo * 7);
    var dia = base.getDay();
    var inicio = new Date(base);
    inicio.setDate(base.getDate() - ((dia + 4) % 7));
    var fim = new Date(inicio);
    fim.setDate(inicio.getDate() + 6);
    return { inicio: inicio, fim: fim };
  }

  function carregarRodada(liga, destino) {
    var faixa = faixaDaRodada(deslocamentoRodada);
    var url = "https://site.api.espn.com/apis/site/v2/sports/soccer/" + liga
      + "/scoreboard?dates=" + aaaammdd(faixa.inicio) + "-" + aaaammdd(faixa.fim);

    var titulo = document.createElement("div");
    titulo.className = "sub-titulo";
    titulo.appendChild(document.createTextNode("📅 Confrontos da rodada"));
    destino.appendChild(titulo);

    var nav = document.createElement("div");
    nav.className = "rodada-nav";
    var esq = document.createElement("button");
    esq.type = "button";
    esq.textContent = "‹";
    esq.title = "Semana anterior";
    var rot = document.createElement("span");
    rot.className = "rodada-nome";
    var dir = document.createElement("button");
    dir.type = "button";
    dir.textContent = "›";
    dir.title = "Próxima semana";
    nav.appendChild(esq);
    nav.appendChild(rot);
    nav.appendChild(dir);
    destino.appendChild(nav);

    var lista = document.createElement("div");
    lista.className = "jogos-lista";
    destino.appendChild(lista);

    function pintar(jogos, rodada) {
      var f = faixaDaRodada(deslocamentoRodada);
      var periodo = f.inicio.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })
        + " a " + f.fim.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
      rot.textContent = rodada ? ("Rodada " + rodada + " · " + periodo) : periodo;
      lista.textContent = "";
      if (!jogos.length) {
        var v = document.createElement("div");
        v.className = "aviso-vazio";
        v.style.gridColumn = "1/-1";
        v.textContent = "Sem jogos nesta semana.";
        lista.appendChild(v);
        return;
      }
      jogos.forEach(function (j) { lista.appendChild(linhaAgenda(j)); });
    }

    function buscar2() {
      var f = faixaDaRodada(deslocamentoRodada);
      var alvo = "https://site.api.espn.com/apis/site/v2/sports/soccer/" + liga
        + "/scoreboard?dates=" + aaaammdd(f.inicio) + "-" + aaaammdd(f.fim);
      rot.textContent = "carregando…";
      pegarJson(alvo).then(function (d) {
        if (tabelaAtiva !== liga) { return; }
        var jogos = [];
        var rodada = null;
        if (d && d.events) {
          d.events.forEach(function (ev) {
            var c = ev.competitions && ev.competitions[0];
            if (!c || !c.competitors || c.competitors.length < 2) { return; }
            var casa = null;
            var fora = null;
            c.competitors.forEach(function (t) {
              if (t.homeAway === "home") { casa = t; } else { fora = t; }
            });
            if (!casa || !fora) { return; }
            if (!rodada && ev.week && ev.week.number) { rodada = ev.week.number; }
            var st = (ev.status && ev.status.type) || {};
            jogos.push({
              comp: "", canais: [],
              quando: ev.date ? new Date(ev.date).getTime() : 0,
              estado: st.state || "pre",
              relogio: (ev.status && ev.status.displayClock) || "",
              link: (ev.links && ev.links[0] && ev.links[0].href) || "",
              casa: dadosTime(casa), fora: dadosTime(fora)
            });
          });
        }
        jogos.sort(function (a, b) { return a.quando - b.quando; });
        pintar(jogos, rodada);
      });
    }

    esq.addEventListener("click", function () { deslocamentoRodada -= 1; buscar2(); });
    dir.addEventListener("click", function () { deslocamentoRodada += 1; buscar2(); });
    buscar2();
  }

  // Os extras ficam isolados: se algum falhar, a tabela e os botões continuam.
  function montarExtras(liga) {
    try {
      carregarRodada(liga, corpoTabela);
    } catch (e) { /* segue sem os confrontos */ }
    try {
      carregarCraques(liga, corpoTabela);
    } catch (e) { /* segue sem artilheiros */ }
  }

  var tabelaMontadaPara = null;

  function carregarTabela(liga) {
    var comp = null;
    TABELAS.forEach(function (c) { if (c.liga === liga) { comp = c; } });
    if (!comp) { return; }

    // Já está desenhada na tela: não refaz nada. Sem isso, cada atualização
    // da página empilhava uma cópia nova e o site travava.
    if (tabelaMontadaPara === liga && corpoTabela.children.length) { return; }

    if (cacheTabela[liga]) {
      desenharTabela(cacheTabela[liga], comp);
      montarExtras(liga);
      tabelaMontadaPara = liga;
      return;
    }

    corpoTabela.textContent = "";
    var carregando = document.createElement("div");
    carregando.className = "carregando";
    carregando.textContent = "Carregando a tabela do " + comp.nome + "…";
    corpoTabela.appendChild(carregando);

    var endereco = "https://site.api.espn.com/apis/v2/sports/soccer/" + liga + "/standings";
    pegarJson(endereco).then(function (dados) {
      if (tabelaAtiva !== liga) { return; }
      var grupos = gruposDaResposta(dados);
      cacheTabela[liga] = grupos;
      desenharTabela(grupos, comp);
      montarExtras(liga);
      tabelaMontadaPara = liga;
    });
  }

  function montarChipsTabela() {
    var caixa = document.getElementById("comp-chips");
    TABELAS.forEach(function (comp) {
      var b = document.createElement("button");
      b.className = "comp-chip";
      b.type = "button";
      b.textContent = comp.nome;
      b.setAttribute("aria-pressed", comp.liga === tabelaAtiva ? "true" : "false");
      b.addEventListener("click", function () {
        tabelaAtiva = comp.liga;
        deslocamentoRodada = 0;
        tabelaMontadaPara = null;
        Array.prototype.forEach.call(caixa.children, function (x) {
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
        });
        carregarTabela(comp.liga);
      });
      caixa.appendChild(b);
    });
  }

  var LIMITE_IDADE = 90 * 60 * 1000;

  function maisRecente() {
    var topo = 0;
    itens.forEach(function (i) { if (i.when > topo) { topo = i.when; } });
    return topo;
  }

  function estaVelho() {
    var topo = maisRecente();
    if (!topo) { return true; }
    return (Date.now() - topo) > LIMITE_IDADE;
  }

  function completarAoVivo() {
    statusEl.textContent = "O conteúdo salvo está atrasado — buscando direto nos sites…";
    return buscarAoVivo(function (parcial) {
      if (parcial.length && parcial[0].when > maisRecente()) {
        aplicar({ carimbo: "", categorias: [], itens: parcial }, true, true);
      }
    }).then(function (lista) {
      if (!lista.length) { aviso("velho"); return; }
      var novoTopo = lista[0].when || 0;
      if (novoTopo > maisRecente()) {
        aplicar({ carimbo: "", categorias: [], itens: lista }, true, true);
        aviso("aovivo");
      } else {
        aviso("velho");
      }
    });
  }

  function buscar(primeira) {
    if (buscando) { return; }
    buscando = true;
    piscaEl.classList.add("on");
    if (primeira && !itens.length) { statusEl.textContent = "Carregando as manchetes…"; }

    fetch("noticias.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("indisponivel"); }
        return r.json();
      })
      .then(function (dados) {
        var antes = itens.length ? itens[0].link : "";
        var mudou = dados.itens.length > 0 && dados.itens[0].link !== antes;
        aplicar(dados, !primeira && mudou, true);
        aviso("json");
        if (estaVelho()) { return completarAoVivo(); }
      })
      .catch(function () {
        var jaMostrou = false;
        return buscarAoVivo(function (parcial) {
          jaMostrou = true;
          aplicar({ carimbo: "", categorias: [], itens: parcial }, false, true);
        }).then(function (lista) {
          if (lista.length) {
            aplicar({ carimbo: "", categorias: [], itens: lista }, !primeira, true);
            aviso("aovivo");
            return;
          }
          if (jaMostrou) { aviso("aovivo"); return; }
          var reserva = melhorInicio();
          aplicar(reserva.dados, false);
          if (itens.length) {
            aviso(estaVelho() ? "velho" : reserva.origem);
          } else {
            statusEl.textContent = "Não consegui carregar as manchetes por nenhum caminho."
              + " Isso costuma ser bloqueio de rede — tente por outra conexão.";
          }
        });
      })
      .then(function () {
        buscando = false;
        piscaEl.classList.remove("on");
      });
  }

  function esqueletos(quantos) {
    grid.textContent = "";
    for (var i = 0; i < quantos; i++) {
      var e = document.createElement("div");
      e.className = "esqueleto";
      var capa = document.createElement("div");
      capa.className = "capa-fake barra";
      e.appendChild(capa);
      ["", "", " curta"].forEach(function (extra) {
        var l = document.createElement("div");
        l.className = "linha barra" + extra;
        e.appendChild(l);
      });
      grid.appendChild(e);
    }
  }

  // Permite instalar no celular e abrir mesmo sem internet.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* sem suporte */ });
  }

  montarAbas();
  ligarSetasAbas();
  atualizarBolhaSalvos();
  montarChipsTabela();
  montarChipsAgenda();
  montarX();
  ligarPlacar();

  esqueletos(8);
  var inicio = melhorInicio();
  aplicar(inicio.dados, false);
  if (itens.length) { aviso(inicio.origem === "salvo" ? "salvo" : "embutido"); }
  buscar(true);

  function atualizarBolha() {
    var btAgenda = document.getElementById("modo-agenda");
  var btTabelas = document.getElementById("modo-tabelas");
  var abaAnterior = CATEGORIAS[0];

  function marcarModos() {
    btAgenda.setAttribute("aria-pressed", abaAtiva === "AGENDA" ? "true" : "false");
    btTabelas.setAttribute("aria-pressed", abaAtiva === "TABELAS" ? "true" : "false");
  }

  function irParaModo(modo) {
    if (abaAtiva === modo) {
      abaAtiva = abaAnterior;
    } else {
      if (abaAtiva !== "AGENDA" && abaAtiva !== "TABELAS") { abaAnterior = abaAtiva; }
      abaAtiva = modo;
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
    render(false);
    marcarModos();
    if (abaAtiva !== "AGENDA" && abaAtiva !== "TABELAS" && itens.length) { aviso("json"); }
  }

  btAgenda.addEventListener("click", function () { irParaModo("AGENDA"); });
  btTabelas.addEventListener("click", function () { irParaModo("TABELAS"); });

  var botaoNovas = document.getElementById("novas");
    if (!botaoNovas) { return; }
    var n = contarNovas();
    var b = botaoNovas.querySelector(".bolha");
    if (n > 0) {
      if (!b) {
        b = document.createElement("span");
        b.className = "bolha";
        botaoNovas.appendChild(b);
      }
      b.textContent = n > 99 ? "99+" : String(n);
    } else if (b) {
      b.remove();
    }
  }

  var botaoNovas = document.getElementById("novas");
  var botaoAvisar = document.getElementById("avisar");

  botaoNovas.addEventListener("click", function () {
    if (soNovas) {
      soNovas = false;
      botaoNovas.setAttribute("aria-pressed", "false");
      marcarComoLido();
      atualizarTitulo();
      atualizarBolha();
      render(false);
      return;
    }
    if (!contarNovas()) {
      statusEl.textContent = "Nada novo desde a sua última visita.";
      return;
    }
    soNovas = true;
    botaoNovas.setAttribute("aria-pressed", "true");
    render(false);
  });

  botaoAvisar.setAttribute("aria-pressed", avisarAtivo ? "true" : "false");
  botaoAvisar.addEventListener("click", function () {
    avisarAtivo = !avisarAtivo;
    botaoAvisar.setAttribute("aria-pressed", avisarAtivo ? "true" : "false");
    try { localStorage.setItem(CHAVE_AVISO, avisarAtivo ? "1" : "0"); }
    catch (e) { /* sem armazenamento */ }
    if (avisarAtivo) {
      tocarSino();
      try {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      } catch (e) { /* sem suporte */ }
      statusEl.textContent = "Aviso ligado — você será alertado quando sair notícia quente.";
    } else {
      statusEl.textContent = "Aviso desligado.";
    }
  });

  var botaoTrad = document.getElementById("traduzir");
  try {
    if (localStorage.getItem("radar:traduzir") === "1") { traduzindoAtivo = true; }
  } catch (e) { /* sem armazenamento */ }
  botaoTrad.setAttribute("aria-pressed", traduzindoAtivo ? "true" : "false");
  botaoTrad.addEventListener("click", function () {
    traduzindoAtivo = !traduzindoAtivo;
    botaoTrad.setAttribute("aria-pressed", traduzindoAtivo ? "true" : "false");
    try { localStorage.setItem("radar:traduzir", traduzindoAtivo ? "1" : "0"); }
    catch (e) { /* sem armazenamento */ }
    render(false);
  });

  var caixaBusca = document.getElementById("busca-caixa");
  var botaoLimpar = document.getElementById("limpar-busca");

  function marcarBusca() {
    if (qEl.value) {
      caixaBusca.className = "busca-caixa tem-texto";
    } else {
      caixaBusca.className = "busca-caixa";
    }
  }

  botaoLimpar.addEventListener("click", function () {
    qEl.value = "";
    marcarBusca();
    render(false);
    qEl.focus();
  });

  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      qEl.value = "";
      marcarBusca();
      render(false);
    }
  });

  qEl.addEventListener("input", function () {
    marcarBusca();
    render(false);
  });
  document.getElementById("reload").addEventListener("click", function () {
    buscar(false);
    buscarPlacar();
  });

  setInterval(function () { buscar(false); }, INTERVALO);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      buscar(false);
      buscarPlacar();
    } else if (!soNovas) {
      marcarComoLido();
    }
  });

  if (!marcoVisita) { marcarComoLido(); }
  atualizarTitulo();
})();
</script>
</body>
</html>
