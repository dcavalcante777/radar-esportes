<html lang="pt-BR" dir="ltr">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Radar Esportes — TNT Sports</title>
<style>
  :root{
    --bg:#0d0f14; --bg-soft:#151922; --card:#171c26; --card-hover:#1e2430;
    --border:#252c3a; --txt:#eef1f6; --txt-dim:#9aa5b8; --accent:#ffd400;
    --accent-2:#e2001a; --chip:#1d2431; --shadow:0 6px 22px rgba(0,0,0,.45);
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f9; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f0f2f7;
      --border:#e0e4ec; --txt:#12151c; --txt-dim:#5c6579; --chip:#eef1f6;
      --shadow:0 4px 16px rgba(20,25,40,.10); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;}
  header{position:sticky;inset-block-start:0;z-index:20;background:var(--bg-soft);
    border-block-end:1px solid var(--border);padding:12px 20px 0;box-shadow:var(--shadow)}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{inline-size:44px;block-size:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:19px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .sub{font-size:12px;color:var(--txt-dim);margin-block-start:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search]{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 12px;border-radius:10px;min-inline-size:200px;font-size:14px}
  button{background:var(--chip);border:1px solid var(--border);color:var(--txt);
    padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
  button:hover{background:var(--card-hover)}
  button.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  nav{display:flex;gap:4px;overflow-x:auto;margin-block-start:12px;
    scrollbar-width:none;-ms-overflow-style:none}
  nav::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-block-end:3px solid transparent;border-radius:0;
    color:var(--txt-dim);padding:11px 14px;font-size:13px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;white-space:nowrap;cursor:pointer}
  .tab:hover{background:none;color:var(--txt)}
  .tab[aria-selected="true"]{color:var(--txt);border-block-end-color:var(--accent)}
  .tab .n{font-size:11px;color:var(--txt-dim);margin-inline-start:5px;font-weight:600}
  .placar{position:relative;margin:0 -20px;padding:0;border-block-end:1px solid var(--border);
    background:linear-gradient(90deg,rgba(226,0,26,.10),transparent 30%)}
  .placar[hidden]{display:none}
  .placar-topo{display:flex;align-items:center;gap:8px;padding:7px 20px 0;font-size:11px;
    font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-dim)}
  .ao-vivo{display:inline-flex;align-items:center;gap:5px;color:var(--accent-2);font-weight:800}
  .ao-vivo i{inline-size:7px;block-size:7px;border-radius:50%;background:var(--accent-2);
    display:inline-block;animation:pulsa 1.1s ease-in-out infinite}
  .trilho{display:flex;gap:10px;overflow-x:auto;padding:8px 20px 10px;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none}
  .trilho::-webkit-scrollbar{display:none}
  .jogo{flex:none;inline-size:206px;background:var(--card);border:1px solid var(--border);
    border-radius:11px;padding:8px 10px;text-decoration:none;color:inherit;display:flex;
    flex-direction:column;gap:5px;transition:.15s}
  .jogo:hover{background:var(--card-hover);border-color:var(--txt-dim)}
  .jogo.vivo{border-color:rgba(226,0,26,.55);box-shadow:0 0 0 1px rgba(226,0,26,.18) inset}
  .jogo-topo{display:flex;justify-content:space-between;align-items:center;gap:6px;
    font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--txt-dim)}
  .jogo-topo b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .minuto{color:var(--accent-2);font-weight:800;flex:none}
  .time{display:flex;align-items:center;gap:7px;font-size:13px}
  .time img{inline-size:17px;block-size:17px;object-fit:contain;flex:none}
  .time span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .time b{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
  .time.perde{color:var(--txt-dim)}
  .seta{position:absolute;inset-block-start:50%;transform:translateY(-30%);z-index:3;
    inline-size:28px;block-size:28px;padding:0;border-radius:50%;display:none;
    align-items:center;justify-content:center;font-size:15px;line-height:1;
    background:var(--bg-soft);border:1px solid var(--border)}
  .seta.esq{inset-inline-start:4px}
  .seta.dir{inset-inline-end:4px}
  .placar:hover .seta{display:flex}
  @media (max-width:700px){.seta{display:none!important}}
  main{padding:20px;max-inline-size:1500px;margin-inline:auto}
  .status{font-size:13px;color:var(--txt-dim);margin-block-end:14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot{inline-size:8px;block-size:8px;border-radius:50%;background:var(--accent);
    display:inline-block;flex:none}
  .dot.on{animation:pulsa 1.1s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:.15s}
  .card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:var(--shadow)}
  .card.novo{animation:entra .45s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .capa{position:relative;aspect-ratio:16/9;background:var(--chip)}
  .thumb{inline-size:100%;block-size:100%;object-fit:cover;display:block}
  .ph{inline-size:100%;block-size:100%;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;color:#fff;text-align:center;padding:12px;
    position:relative;overflow:hidden}
  .ph::after{content:"";position:absolute;inset:0;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.34))}
  .ph b{font-weight:800;font-size:17px;letter-spacing:.5px;z-index:1;
    text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .ph span{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;z-index:1}
  .play{position:absolute;inset-block-end:8px;inset-inline-start:8px;background:rgba(226,0,26,.94);
    color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:6px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;
    color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .src{background:var(--chip);border:1px solid var(--border);padding:3px 8px;
    border-radius:999px;font-weight:700;color:var(--txt)}
  .tag{padding:3px 8px;border-radius:999px;font-weight:700;font-size:10px;
    background:rgba(255,212,0,.14);color:var(--accent);border:1px solid rgba(255,212,0,.28)}
  .ttl{font-size:15px;font-weight:700;line-height:1.35;margin:0}
  .desc{font-size:13px;color:var(--txt-dim);line-height:1.45;margin:0}
  .section-title{font-size:15px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--txt-dim);margin:30px 0 12px;padding-block-end:8px;
    border-block-end:1px solid var(--border)}
  .xgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .xcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px}
  .xcard:hover{background:var(--card-hover)}
  .xname{font-weight:700;font-size:14px}
  .xhandle{font-size:12px;color:var(--txt-dim)}
  .empty{padding:40px;text-align:center;color:var(--txt-dim);font-size:14px}
  footer{padding:24px 20px 40px;text-align:center;color:var(--txt-dim);font-size:12px}
  @media print{header{position:static}.card:hover{transform:none}}
</style>
</head>

  <div class="xgrid" id="xgrid"></div>
</main>

  function pegarJson(endereco) {
    var i = 0;
    function tentar() {
      if (i >= PROXIES.length) { return Promise.resolve(null); }
      return fetch(PROXIES[i++](endereco), { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.json(); })
        .catch(function () { return tentar(); });
    }
    return tentar();
  }

  function lerCompeticao(comp) {
    var endereco = "https://site.api.espn.com/apis/site/v2/sports/soccer/"
      + comp.liga + "/scoreboard";
    return pegarJson(endereco).then(function (dados) {
      if (!dados || !dados.events) { return []; }
      var saida = [];
      dados.events.forEach(function (ev) {
        var c = ev.competitions && ev.competitions[0];
        if (!c || !c.competitors || c.competitors.length < 2) { return; }
        var casa = null;
        var fora = null;
        c.competitors.forEach(function (t) {
          if (t.homeAway === "home") { casa = t; } else { fora = t; }
        });
        if (!casa || !fora) { return; }
        var st = (ev.status && ev.status.type) || {};
        var quando = ev.date ? new Date(ev.date).getTime() : 0;
        var hoje = new Date();
        var dia = new Date(quando);
        var mesmoDia = dia.getDate() === hoje.getDate()
          && dia.getMonth() === hoje.getMonth()
          && dia.getFullYear() === hoje.getFullYear();
        if (!mesmoDia && st.state !== "in") { return; }
        saida.push({
          comp: comp.nome,
          estado: st.state || "pre",
          detalhe: st.shortDetail || "",
          relogio: (ev.status && ev.status.displayClock) || "",
          periodo: (ev.status && ev.status.period) || 0,
          quando: quando,
          link: (ev.links && ev.links[0] && ev.links[0].href) || "",
          casa: dadosTime(casa),
          fora: dadosTime(fora)
        });
      });
      return saida;
    });
  }

  function dadosTime(t) {

    return {
      nome: time.shortDisplayName || time.abbreviation || time.displayName || "",
      logo: time.logo || "",
      gols: (t.score === undefined || t.score === null) ? "" : String(t.score),
      vencedor: t.winner === true
    };
  }

  function rotuloMinuto(j) {
    if (j.estado === "in") {

      return j.periodo === 2 ? "2ºT" : "1ºT";

    if (j.estado === "post") { return "FIM"; }
    if (!j.quando) { return j.detalhe; }
    return new Date(j.quando).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    a.className = "jogo" + (j.estado === "in" ? " vivo" : "");
    a.href = j.link || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var topo = document.createElement("div");
    topo.className = "jogo-topo";
    var c = document.createElement("b");
    c.textContent = j.comp;
    var m = document.createElement("span");
    m.className = j.estado === "in" ? "minuto" : "";
    m.textContent = rotuloMinuto(j);
    topo.appendChild(c);
    topo.appendChild(m);

    a.appendChild(topo);

  function ordemJogo(j) {
    if (j.estado === "in") { return 0; }
    if (j.estado === "pre") { return 1; }
    return 2;

  function desenharPlacar() {
    if (!jogos.length) {
      placarEl.hidden = true;
      return;
    }
    placarEl.hidden = false;
    trilho.textContent = "";
    jogos.forEach(function (j) { trilho.appendChild(cardJogo(j)); });

    var vivos = jogos.filter(function (j) { return j.estado === "in"; }).length;
    placarRotulo.textContent = "";
    if (vivos) {
      var v = document.createElement("span");
      v.className = "ao-vivo";
      var i = document.createElement("i");
      v.appendChild(i);
      v.appendChild(document.createTextNode(vivos + (vivos > 1 ? " jogos ao vivo" : " jogo ao vivo")));
      placarRotulo.appendChild(v);
    } else {
      placarRotulo.textContent = "Jogos de hoje";
    }
  }

  function buscarPlacar() {
    if (buscandoPlacar) { return; }
    buscandoPlacar = true;
    Promise.all(COMPETICOES.map(lerCompeticao)).then(function (todas) {
      var lista = [];
      todas.forEach(function (arr) { arr.forEach(function (j) { lista.push(j); }); });
      lista.sort(function (a, b) {
        var d = ordemJogo(a) - ordemJogo(b);
        return d !== 0 ? d : a.quando - b.quando;
      });
      jogos = lista.slice(0, 40);
      desenharPlacar();
      buscandoPlacar = false;
    }).catch(function () {
      buscandoPlacar = false;
    });
  }

  function girar() {
    if (giroPausado || placarEl.hidden || !jogos.length) { return; }
    var fim = trilho.scrollWidth - trilho.clientWidth - 8;
    if (trilho.scrollLeft >= fim) {
      trilho.scrollTo({ left: 0, behavior: "smooth" });
    } else {
      trilho.scrollBy({ left: 216, behavior: "smooth" });
    }
  }

  function ligarPlacar() {
    document.getElementById("seta-esq").addEventListener("click", function () {
      trilho.scrollBy({ left: -432, behavior: "smooth" });
    });
    document.getElementById("seta-dir").addEventListener("click", function () {
      trilho.scrollBy({ left: 432, behavior: "smooth" });
    });
    ["mouseenter", "touchstart", "focusin"].forEach(function (e) {
      placarEl.addEventListener(e, function () { giroPausado = true; });
    });
    ["mouseleave", "touchend", "focusout"].forEach(function (e) {
      placarEl.addEventListener(e, function () { giroPausado = false; });
    });
    buscarPlacar();
    setInterval(buscarPlacar, PLACAR_INTERVALO);
    setInterval(girar, GIRO);
  }

  function classificar(texto, padrao) {
    var t = texto.toLowerCase();
    var i;
    for (i = 0; i < FOFOCA.length; i++) {
      if (t.indexOf(FOFOCA[i]) >= 0) { return "FOFOCAS"; }
    }
    if (padrao !== "AUTO") { return padrao; }
    for (i = 0; i < MAPA.length; i++) {
      for (var j = 0; j < MAPA[i][1].length; j++) {
        if (t.indexOf(MAPA[i][1][j]) >= 0) { return MAPA[i][0]; }
      }
    }
    return "OUTROS ESPORTES";
  }

  function texto(node, nomes) {
    for (var i = 0; i < nomes.length; i++) {
      var el = node.getElementsByTagName(nomes[i])[0];
      if (el && el.textContent) { return el.textContent.trim(); }
    }
    return "";
  }

  function semTags(bruto) {
    var d = document.createElement("div");
    d.innerHTML = String(bruto || "");
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }

  function fotoDoItem(node) {
    var tags = ["media:content", "media:thumbnail", "enclosure", "image"];
    for (var i = 0; i < tags.length; i++) {
      var lista = node.getElementsByTagName(tags[i]);
      for (var j = 0; j < lista.length; j++) {
        var u = lista[j].getAttribute("url") || lista[j].getAttribute("href");
        var tipo = lista[j].getAttribute("type") || "";
        if (u && (tipo.indexOf("image") === 0 || /\.(jpe?g|png|webp|avif)/i.test(u))) {
          return u;
        }
      }
    }
    var corpo = texto(node, ["content:encoded", "description", "summary"]);
    var m = corpo.match(/<img[^>]+src=["\']([^"\']+)["\']/i);
    if (m) { return m[1]; }
    m = corpo.match(/https?:\/\/[^\s"\'<>]+\.(?:jpe?g|png|webp|avif)/i);
    return m ? m[0] : "";
  }

  function lerFeed(fonte) {
    var nome = fonte[0];
    var padrao = fonte[1];
    var endereco = fonte[2];
    var i = 0;

    function tentar() {
      if (i >= PROXIES.length) { return Promise.resolve([]); }
      return fetch(PROXIES[i++](endereco), { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.text(); })
        .then(function (bruto) {
          var doc = new DOMParser().parseFromString(bruto, "text/xml");
          if (doc.getElementsByTagName("parsererror").length) { throw new Error("xml"); }
          var nos = doc.getElementsByTagName("item");
          if (!nos.length) { nos = doc.getElementsByTagName("entry"); }
          if (!nos.length) { throw new Error("vazio"); }
          var saida = [];
          for (var k = 0; k < nos.length && k < 8; k++) {
            var n = nos[k];
            var titulo = semTags(texto(n, ["title"]));
            var link = texto(n, ["link"]);
            if (!link) {
              var a = n.getElementsByTagName("link")[0];
              if (a) { link = a.getAttribute("href") || ""; }
            }
            if (!titulo || !link) { continue; }
            var resumo = semTags(texto(n, ["description", "summary"])).slice(0, 170);
            var quandoTxt = texto(n, ["pubDate", "published", "updated", "dc:date"]);
            var ts = quandoTxt ? new Date(quandoTxt).getTime() : 0;
            saida.push({
              title: titulo,
              link: link,
              desc: resumo,
              img: fotoDoItem(n),
              src: nome,
              cat: classificar(titulo + " " + resumo, padrao),
              when: isNaN(ts) ? 0 : ts,
              tipo: "noticia"
            });
          }
          if (!saida.length) { throw new Error("vazio"); }
          return saida;
        })
        .catch(function () { return tentar(); });
    }
    return tentar();
  }

  function buscarAoVivo() {

      var vistos = {};
      todos.forEach(function (arr) {
        arr.forEach(function (it) {
          var chave = it.title.toLowerCase().slice(0, 70);
          if (!vistos[chave]) { vistos[chave] = 1; lista.push(it); }
        });
      });
      lista.sort(function (a, b) { return b.when - a.when; });
      return lista;
    });
  }

  function ago(ts) {
    if (!ts) { return ""; }
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) { return "agora"; }
    if (mins < 60) { return "há " + mins + " min"; }
    var h = Math.round(mins / 60);
    if (h < 24) { return "há " + h + "h"; }
    return "há " + Math.round(h / 24) + "d";
  }

  function corDaFonte(nome) {
    var h = 0;
    for (var i = 0; i < nome.length; i++) { h = (h * 31 + nome.charCodeAt(i)) % 360; }
    return h;
  }

  function placeholder(it) {
    var h = corDaFonte(it.src);
    var d = document.createElement("div");
    d.className = "ph";

      + ((h + 42) % 360) + ",48%,17%))";
    var b = document.createElement("b");
    b.textContent = it.src;
    var c = document.createElement("span");
    c.textContent = rotulo(it.cat);
    d.appendChild(b);
    d.appendChild(c);
    return d;
  }

  function enderecosDaFoto(url) {
    if (!url || url.indexOf("http") !== 0) { return []; }

    // Miniatura do YouTube ja e servida sem restricao.
    if (url.indexOf("ytimg.com") >= 0) { return [url]; }

    var sem = url.replace(/^https?:\/\//, "");
    var espelho = "https://images.weserv.nl/?url=" + encodeURIComponent(sem)
      + "&w=640&h=360&fit=cover&we&output=jpg&q=74";
    var espelho2 = "https://wsrv.nl/?url=" + encodeURIComponent(sem)
      + "&w=640&h=360&fit=cover&we&output=jpg&q=74";

    return [espelho, espelho2, url];
  }

  function montarCapa(it) {
    var capa = document.createElement("div");
    capa.className = "capa";

    var opcoes = enderecosDaFoto(it.img);
    var i = 0;

    function reserva() {
      capa.textContent = "";
      capa.appendChild(placeholder(it));
      if (it.tipo === "video") { capa.appendChild(selo()); }
    }

    function tentar() {
      if (i >= opcoes.length) { reserva(); return; }
      var img = document.createElement("img");
      img.className = "thumb";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.alt = "";
      img.addEventListener("error", function () {
        i += 1;
        capa.textContent = "";
        tentar();
        if (it.tipo === "video" && i < opcoes.length) { capa.appendChild(selo()); }
      });
      img.src = opcoes[i];
      capa.appendChild(img);
    }

    if (opcoes.length) { tentar(); } else { capa.appendChild(placeholder(it)); }
    if (it.tipo === "video") { capa.appendChild(selo()); }
    return capa;
  }

  function card(it, novo) {
    var a = document.createElement("a");
    a.className = "card" + (novo ? " novo" : "");
    a.href = it.link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

  function combina(it, q) {
    if (!q) { return true; }
    return (it.title + " " + it.desc + " " + it.src).toLowerCase().indexOf(q) >= 0;
  }

  function filtrar(tipo) {
    var q = qEl.value.toLowerCase().trim();
    return itens.filter(function (it) {
      if (it.tipo !== tipo) { return false; }
      if (abaAtiva !== "TUDO" && it.cat !== abaAtiva) { return false; }
      return combina(it, q);
    });
  }

  function marcarAbas() {
    var q = qEl.value.toLowerCase().trim();
    Array.prototype.forEach.call(abasEl.children, function (b) {

      var n = 0;
      itens.forEach(function (it) {
        if (cat !== "TUDO" && it.cat !== cat) { return; }
        if (combina(it, q)) { n += 1; }
      });
      b.setAttribute("aria-selected", cat === abaAtiva ? "true" : "false");
      b.querySelector(".n").textContent = n ? n : "";

  }

    emptyEl.hidden = !vazio;

    marcarAbas();
  }

  function aviso(origem) {
    var agora = new Date();
    var texto2 = itens.length + " itens de " + contarFontes() + " fontes";
    if (carimbo) { texto2 += " • conteúdo de " + carimbo; }
    texto2 += " • atualizado às "
      + agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    if (origem === "aovivo") {
      texto2 += " • buscado direto nos sites";

    if (origem === "embutido") {
      texto2 += " • cópia embutida na página";

  function buscar(primeira) {
    if (buscando) { return; }
    buscando = true;
    piscaEl.classList.add("on");
    if (primeira && !itens.length) { statusEl.textContent = "Carregando as manchetes…"; }

    fetch("noticias.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("indisponivel"); }
        return r.json();
      })
      .then(function (dados) {
        var antes = itens.length ? itens[0].link : "";
        var mudou = dados.itens.length > 0 && dados.itens[0].link !== antes;
        aplicar(dados, !primeira && mudou);
        aviso("json");
      })
      .catch(function () {
        return buscarAoVivo().then(function (lista) {
          if (lista.length) {
            aplicar({ carimbo: "", categorias: [], itens: lista }, !primeira);
            aviso("aovivo");
            return;
          }
          aplicar(DADOS, false);
          if (itens.length) {
            aviso("embutido");
          } else {
            statusEl.textContent = "Não consegui carregar as manchetes por nenhum caminho."
              + " Isso costuma ser bloqueio de rede — tente por outra conexão.";
          }
        });
      })
      .then(function () {
        buscando = false;
        piscaEl.classList.remove("on");
      });
  }

  montarAbas();
  montarX();
  ligarPlacar();
  aplicar(DADOS, false);
  buscar(true);

  qEl.addEventListener("input", function () { render(false); });
  document.getElementById("reload").addEventListener("click", function () {

    buscarPlacar();

  setInterval(function () { buscar(false); }, INTERVALO);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { buscar(false); buscarPlacar(); }
  });
})();
